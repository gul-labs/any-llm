packages:
  - 'packages/*'

autoInstallPeers: false
strictPeerDependencies: false

# Provider tests use shared fakes, whose SDK types depend on the providers.
# These dev-only cycles do not appear in the published entry-point graph.
ignoreWorkspaceCycles: true

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
