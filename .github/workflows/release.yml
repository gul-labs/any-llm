name: Release

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check repository.url matches GITHUB_REPOSITORY
        run: |
          node --input-type=module <<'EOF'
          import { readdirSync, readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const expected = process.env.GITHUB_REPOSITORY
          if (!expected) {
            throw new Error('GITHUB_REPOSITORY is unset')
          }

          const failures = []
          for (const entry of readdirSync('packages', { withFileTypes: true })) {
            if (!entry.isDirectory()) continue
            let pkg
            try {
              pkg = JSON.parse(readFileSync(join('packages', entry.name, 'package.json'), 'utf8'))
            } catch (error) {
              if (error && typeof error === 'object' && 'code' in error && error.code === 'ENOENT') continue
              throw error
            }
            if (pkg.private === true || typeof pkg.name !== 'string') continue
            const url = String(pkg.repository?.url ?? '')
            const match = url.match(/^(?:git\+)?https:\/\/github\.com\/([^/]+\/[^/]+?)(?:\.git)?$/)
            const path = match?.[1]
            if (path === undefined) {
              failures.push(`${entry.name}: unparseable repository.url=${JSON.stringify(url)}`)
            } else if (path !== expected) {
              failures.push(`${entry.name}: repository.url path ${path} !== ${expected}`)
            }
          }
          if (failures.length > 0) {
            console.error(failures.join('\n'))
            process.exitCode = 1
          } else {
            console.log(`repository.url path matches ${expected}`)
          }
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
