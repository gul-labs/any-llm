version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # typescript-eslint 8.72 still declares `typescript: >=4.8.4 <6.1.0`.
    # Hold TypeScript on 6.x until the lint toolchain supports 7.
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      production-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
